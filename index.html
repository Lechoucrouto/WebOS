<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebOS — Rust #![no_std] Desktop in WebAssembly</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #07090d;
      color: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      user-select: none;
    }
    canvas {
      border: 2px solid #21262d;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      width: 1280px;
      max-width: 95vw;
      height: auto;
      cursor: none;
    }
    .hint {
      font-size: 13px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <canvas id="display"></canvas>
  <div class="hint">Drag window titlebars, click taskbar apps, or click the Terminal window and type <code>help</code></div>

  <script>
    async function boot() {
      let wasmMemory;
      const decoder = new TextDecoder("utf-8");

      const importObject = {
        env: {
          js_now_ms: () => performance.now(),
          js_console_log: (ptr, len) => {
            const bytes = new Uint8Array(wasmMemory.buffer, ptr, len);
            console.log(decoder.decode(bytes));
          },
        },
      };

      const { instance } = await WebAssembly.instantiateStreaming(
        fetch("./target/wasm32-unknown-unknown/release/webos.wasm"),
        importObject
      );

      const wasm = instance.exports;
      wasmMemory = wasm.memory;

      wasm.kernel_boot();

      const width = wasm.fb_width();
      const height = wasm.fb_height();
      const canvas = document.getElementById("display");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");

      function mapCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor(((e.clientX - rect.left) / rect.width) * width);
        const y = Math.floor(((e.clientY - rect.top) / rect.height) * height);
        return [x, y];
      }

      canvas.addEventListener("mousemove", (e) => {
        const [x, y] = mapCoords(e);
        wasm.kernel_mouse_move(x, y);
      });

      canvas.addEventListener("mousedown", (e) => {
        e.preventDefault();
        const [x, y] = mapCoords(e);
        wasm.kernel_mouse_down(x, y, e.button);
      });

      window.addEventListener("mouseup", (e) => {
        const [x, y] = mapCoords(e);
        wasm.kernel_mouse_up(x, y, e.button);
      });

      window.addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key === "Enter") {
          e.preventDefault();
          wasm.kernel_key_input(13);
        } else if (e.key === "Backspace") {
          e.preventDefault();
          wasm.kernel_key_input(8);
        } else if (e.key.length === 1) {
          e.preventDefault();
          wasm.kernel_key_input(e.key.charCodeAt(0));
        }
      });

      function frame() {
        wasm.kernel_tick();
        const ptr = wasm.fb_ptr();
        const pixels = new Uint8ClampedArray(wasmMemory.buffer, ptr, width * height * 4);
        ctx.putImageData(new ImageData(pixels, width, height), 0, 0);
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    }

    boot();
  </script>
</body>
</html>
