<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebOS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07090d;
      color: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #screen-wrap {
      border: 1px solid #21262d;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8);
      background: #000;
    }
    canvas {
      display: block;
      width: 1024px;
      height: 640px;
      cursor: none;
      image-rendering: pixelated;
    }
    #hint {
      margin-top: 10px;
      font-size: 12px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div id="screen-wrap">
    <canvas id="os-canvas" width="1024" height="640" tabindex="0"></canvas>
  </div>
  <div id="hint">WebOS Kernel • Persistent Storage Enabled • Click canvas to focus</div>

  <script type="module">
    import init, { boot_webos } from "./pkg/webos.js";

    async function main() {
      const wasm = await init();
      const os = boot_webos();

      const width = os.width();
      const height = os.height();
      const canvas = document.getElementById("os-canvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      const imgData = ctx.createImageData(width, height);

      function canvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = width / rect.width;
        const scaleY = height / rect.height;
        return {
          x: Math.floor((e.clientX - rect.left) * scaleX),
          y: Math.floor((e.clientY - rect.top) * scaleY),
        };
      }

      canvas.addEventListener("mousemove", (e) => {
        const { x, y } = canvasCoords(e);
        os.on_mouse_move(x, y);
      });

      canvas.addEventListener("mousedown", (e) => {
        canvas.focus();
        const { x, y } = canvasCoords(e);
        os.on_mouse_down(x, y, e.button);
      });

      window.addEventListener("mouseup", (e) => {
        const { x, y } = canvasCoords(e);
        os.on_mouse_up(x, y, e.button);
      });

      canvas.addEventListener("contextmenu", (e) => e.preventDefault());

      canvas.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          os.on_wheel(Math.sign(e.deltaX), Math.sign(e.deltaY));
        },
        { passive: false }
      );

      window.addEventListener("keydown", (e) => {
        if (document.activeElement !== canvas && document.activeElement !== document.body) {
          return;
        }
        const ctrl = e.ctrlKey || e.metaKey;

        if (ctrl && (e.key === "s" || e.key === "S")) {
          e.preventDefault();
          os.on_key(1001);
          return;
        }
        if (ctrl && (e.key === "b" || e.key === "B")) {
          e.preventDefault();
          os.on_key(1002);
          return;
        }
        if (ctrl && (e.key === "r" || e.key === "R")) {
          e.preventDefault();
          os.on_key(1003);
          return;
        }
        if (ctrl && (e.key === "g" || e.key === "G")) {
          e.preventDefault();
          os.on_key(1004);
          return;
        }
        if (e.key === "Escape") {
          e.preventDefault();
          os.on_key(27);
          return;
        }
        if (e.key === "Backspace") {
          e.preventDefault();
          os.on_key(8);
          return;
        }
        if (e.key === "Enter") {
          e.preventDefault();
          os.on_key(13);
          return;
        }
        if (e.key === "Tab") {
          e.preventDefault();
          os.on_key(9);
          return;
        }
        if (e.key === "ArrowUp") {
          e.preventDefault();
          os.on_key(38);
          return;
        }
        if (e.key === "ArrowDown") {
          e.preventDefault();
          os.on_key(40);
          return;
        }
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          os.on_key(37);
          return;
        }
        if (e.key === "ArrowRight") {
          e.preventDefault();
          os.on_key(39);
          return;
        }
        if (!ctrl && !e.altKey && e.key.length === 1) {
          e.preventDefault();
          os.on_key(e.key.charCodeAt(0));
        }
      });

      function frame() {
        os.tick();
        const ptr = os.framebuffer_ptr();
        const len = os.framebuffer_len();
        const view = new Uint8ClampedArray(wasm.memory.buffer, ptr, len * 4);
        imgData.data.set(view);
        ctx.putImageData(imgData, 0, 0);
        requestAnimationFrame(frame);
      }

      canvas.focus();
      requestAnimationFrame(frame);
    }

    main();
  </script>
</body>
</html>
