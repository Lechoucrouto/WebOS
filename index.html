<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebOS — Rust #![no_std] Desktop in WebAssembly</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #111827 0%, #05070b 100%);
      color: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      user-select: none;
    }
    canvas {
      border: 1px solid #263042;
      border-radius: 12px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(88, 166, 255, 0.08);
      width: 1280px;
      max-width: 96vw;
      height: auto;
      cursor: none;
    }
    .hint {
      font-size: 12px;
      color: #8b949e;
      letter-spacing: 0.3px;
    }
    code {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 2px 6px;
      border-radius: 4px;
      color: #79c0ff;
    }
  </style>
</head>
<body>
  <canvas id="display"></canvas>
  <div class="hint">
    Click <code>WebOS</code> (bottom-right) or press <code>Win / Super / F1</code> to launch apps &bull;
    Open <code>.wbml</code> in <code>Editor</code> for live split-pane UI preview
  </div>

  <script>
    async function boot() {
      let wasmMemory;
      const decoder = new TextDecoder("utf-8");

      const importObject = {
        env: {
          js_now_ms: () => performance.now(),
          js_console_log: (ptr, len) => {
            const bytes = new Uint8Array(wasmMemory.buffer, ptr, len);
            console.log(decoder.decode(bytes));
          },
        },
      };

      const { instance } = await WebAssembly.instantiateStreaming(
        fetch("./target/wasm32-unknown-unknown/release/webos.wasm?v=5"),
        importObject
      );

      const wasm = instance.exports;
      wasmMemory = wasm.memory;

      wasm.kernel_boot();

      const width = wasm.fb_width();
      const height = wasm.fb_height();
      const canvas = document.getElementById("display");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");

      function mapCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor(((e.clientX - rect.left) / rect.width) * width);
        const y = Math.floor(((e.clientY - rect.top) / rect.height) * height);
        return [x, y];
      }

      canvas.addEventListener("mousemove", (e) => {
        const [x, y] = mapCoords(e);
        wasm.kernel_mouse_move(x, y);
      });

      canvas.addEventListener("mousedown", (e) => {
        e.preventDefault();
        const [x, y] = mapCoords(e);
        wasm.kernel_mouse_down(x, y, e.button);
      });

      window.addEventListener("mouseup", (e) => {
        const [x, y] = mapCoords(e);
        wasm.kernel_mouse_up(x, y, e.button);
      });

      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 1011 : 1010;
        wasm.kernel_key_input(delta);
      }, { passive: false });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Meta" || e.key === "OS" || e.key === "F1") {
          e.preventDefault();
          wasm.kernel_key_input(1005);
          return;
        }

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          wasm.kernel_key_input(2001);
          return;
        }

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "r") {
          e.preventDefault();
          wasm.kernel_key_input(2002);
          return;
        }

        if (e.ctrlKey || e.metaKey || e.altKey) return;

        const specialKeys = {
          Backspace: 8,
          Tab: 9,
          Enter: 13,
          Escape: 27,
          Delete: 127,
          ArrowUp: 1001,
          ArrowDown: 1002,
          ArrowLeft: 1003,
          ArrowRight: 1004,
          PageUp: 1006,
          PageDown: 1007,
          Home: 1008,
          End: 1009,
        };

        if (specialKeys[e.key] !== undefined) {
          e.preventDefault();
          wasm.kernel_key_input(specialKeys[e.key]);
        } else if (e.key.length === 1) {
          e.preventDefault();
          const code = e.key.charCodeAt(0);
          if (code >= 32 && code <= 126) {
            wasm.kernel_key_input(code);
          }
        }
      });

      function frame() {
        wasm.kernel_tick();
        const ptr = wasm.fb_ptr();
        const pixels = new Uint8ClampedArray(wasmMemory.buffer, ptr, width * height * 4);
        ctx.putImageData(new ImageData(pixels, width, height), 0, 0);
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    }

    boot();
  </script>
</body>
</html>
